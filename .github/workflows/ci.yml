name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for triggering the workflow run'
        required: false
        default: "Manual trigger"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write
  statuses: write

env:
  SWIFT_VERSION: "6.2.4"
  XCODE_VERSION: "16.4"

jobs:
  build-and-lint:
    runs-on: macos-15
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
    
    - name: Install Swift toolchain
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: ${{ env.SWIFT_VERSION }}
    
    - name: Install validation tools
      run: |
        brew install shellcheck
        validation_tools_dir="${{ runner.temp }}/axorcist-validation-tools"
        scripts/install-validation-tools.sh "$validation_tools_dir"
        echo "$validation_tools_dir" >> "$GITHUB_PATH"
    
    - name: Build
      run: |
        swift build
    
    - name: Run formatting and linting checks
      run: make check
    
    - name: Run safe tests
      run: swift test

    - name: Verify CLI release packaging
      shell: bash
      run: |
        shellcheck scripts/*.sh
        version="$(sed -n 's/.*axorcVersion = "\([^"]*\)".*/\1/p' Sources/axorc/Models/AXORCModels.swift)"
        scripts/build-release-artifact.sh "$version" --adhoc
        archive="dist/axorc-$version-macos-universal.zip"
        test "$(unzip -Z1 "$archive")" = "axorc"
        (cd dist && shasum -a 256 -c "$(basename "$archive").sha256")
        sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
        scripts/render-homebrew-formula.sh "$version" "$sha256" > /tmp/axorc.rb
        grep -Fq 'skip_clean "bin/axorc"' /tmp/axorc.rb
        ruby -c /tmp/axorc.rb
